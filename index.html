<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Security Label Designer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
<style>
:root{--bg:#f5f5f3;--fg:#1c1c1a;--card:#fff;--bd:#d9d9d4;--ac:#1f6feb;--mu:#6b6b66;--pv:#e4e4df;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#ececea;--card:#222226;--bd:#38383e;--ac:#5b9cff;--mu:#9a9aa2;--pv:#2c2c31;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17171a;--fg:#ececea;--card:#222226;--bd:#38383e;--ac:#5b9cff;--mu:#9a9aa2;--pv:#2c2c31;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:10px 14px;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0 auto 0 0}
main{display:flex;gap:12px;padding:12px;align-items:flex-start}
#view{flex:1 1 55%;position:sticky;top:8px;background:var(--pv);border:1px solid var(--bd);border-radius:8px;padding:8px;min-width:0}
#stage svg{width:100%;height:auto;max-height:70vh;display:block}
#panel{flex:1 1 45%;min-width:0}
details{background:var(--card);border:1px solid var(--bd);border-radius:8px;margin-bottom:8px}
summary{padding:8px 10px;font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:center}
.b{padding:0 10px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.b>.w,.row{grid-column:1/-1}
.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;padding:6px;border:1px dashed var(--bd);border-radius:6px}
.row>.w{grid-column:1/-1}
label{display:flex;flex-direction:column;font-size:11px;color:var(--mu);gap:2px}
input,select,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:5px 6px;min-width:0}
input[type=color]{padding:1px;height:30px}input[type=checkbox]{width:auto}
button{cursor:pointer;background:var(--card)}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
small{color:var(--mu);grid-column:1/-1}
@media(max-width:800px){main{flex-direction:column}#view{position:static;width:100%}#panel{width:100%}}
</style></head><body>
<header><h1>Security Label Designer</h1>
<button data-a="save">Save project</button><button data-a="load">Load project</button>
<button data-a="export">Layered SVG</button><button class="p" data-a="pdfx">Export vector PDF</button></header>
<main><div id="view"><div id="stage"></div><small id="msg"></small></div><div id="panel"></div></main>
<input type="file" id="fpdf" accept=".pdf" hidden><input type="file" id="fsvg" accept=".svg,.pdf,.eps" hidden><input type="file" id="fjson" accept=".json" hidden><input type="file" id="ffont" accept=".ttf,.otf,.woff" multiple hidden><input type="file" id="fase" accept=".ase" hidden>
<script>
const PT=.3528,$=s=>document.querySelector(s);
const FONTS={},fkeys=()=>Object.keys(FONTS),fget=n=>FONTS[n]||FONTS[fkeys()[0]]||null;
const fa=n=>{const f=fget(n);return f?`font-family="'${f.fam}',Arial,sans-serif" font-weight="400"`:'font-family="Arial,Helvetica,sans-serif" font-weight="700"'};
const S={shape:'rect',w:80,h:50,r:6,custom:null,guides:true,
micro:{on:true,text:'GENUINE ORIGINAL ',size:4,safe:1.5,band:5,color:'#111111'},
void:{on:true,lines:[{t:'OPENED',size:12,rep:4},{t:'OPENED',size:12,rep:4},{t:'OPENED',size:12,rep:4}],gap:6,ls:0,x:0,y:0,angle:0,color:'#111111'},
rel:{on:true,color:'#1f6feb'},
white:{on:true,op:.6,items:[{type:'text',t:'SECURE',x:0,y:-5,size:20,rot:0}]},
data:{on:true,color:'#000000',items:[{type:'code128',v:'123456789',x:0,y:8,w:40,h:9,rot:0,txt:true}]}};
let M={};
S.white.color='#ffffff';S.white.spot='White';S.micro.spot='Micro Text';Object.assign(S.micro,{ls:0,reps:0,off:0,mode:'cont'});S.sub='#b9bcc2';S.void.items=[];S.rel.items=[];S.micro.sides=defaultSides();S.void.spot='Void';S.rel.spot='Release';S.data.spot='Data Black';S.micro.font=S.void.font=S.white.font=S.data.font='';
const get=(o,p)=>p.split('.').reduce((a,k)=>a?.[k],o);
const set=(o,p,v)=>{const k=p.split('.'),l=k.pop();get(o,k.join('.')||'')?.constructor;let t=o;k.forEach(x=>t=t[x]);t[l]=v};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>Math.round(v*100)/100;

/* ---------- shapes (mm) ---------- */
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));return `M${x+r} ${y}H${x+w-r}A${r} ${r} 0 0 1 ${x+w} ${y+r}V${y+h-r}A${r} ${r} 0 0 1 ${x+w-r} ${y+h}H${x+r}A${r} ${r} 0 0 1 ${x} ${y+h-r}V${y+r}A${r} ${r} 0 0 1 ${x+r} ${y}Z`}
function shapeD(i){const W=S.w,H=S.h,w=W-2*i,h=H-2*i;if(w<=0||h<=0)return'';const k=S.shape;
 if(k=='rect'||k=='square')return rr(i,i,w,h,0);
 if(k=='round')return rr(i,i,w,h,S.r-i);
 if(k=='circle'||k=='oval')return `M${i} ${H/2}A${w/2} ${h/2} 0 1 0 ${W-i} ${H/2}A${w/2} ${h/2} 0 1 0 ${i} ${H/2}Z`;
 const c=S.custom;if(!c)return rr(i,i,w,h,0);const sx=w/c.bw,sy=h/c.bh;
 return c.segs.map(s=>s[0]+s.slice(1).map((v,j)=>num(j%2?i+v*sy:i+v*sx)).join(' ')).join('')}

/* ---------- code 128 (set B) ---------- */
const P='212222,222122,222221,121223,121322,131222,122213,122312,132212,221213,221312,231212,112232,122132,122231,113222,123122,123221,223211,221132,221231,213212,223112,312131,311222,321122,321221,312212,322112,322211,212123,212321,232121,111323,131123,131321,112313,132113,132311,211313,231113,231311,112133,112331,132131,113123,113321,133121,313121,211331,231131,213113,213311,213131,311123,311321,331121,312113,312311,332111,314111,221411,431111,111224,111422,121124,121421,141122,141221,112214,112412,122114,122411,142112,142211,241211,221114,413111,241112,134111,111242,121142,121241,114212,124112,124211,411212,421112,421211,212141,214121,412121,111143,111341,131141,114113,114311,411113,411311,113141,114131,311141,411131,211412,211214,211232,2331112'.split(',');
function c128b(v,w){const c=[104];let sum=104,n=0;for(const ch of v){const k=ch.charCodeAt(0)-32;if(k<0||k>94)continue;n++;c.push(k);sum+=k*n}c.push(sum%103,106);
 let x=10,bars=[];c.forEach(k=>[...P[k]].forEach((d,j)=>{d=+d;if(j%2==0)bars.push([x,d]);x+=d}));
 const u=w/(x+10);return bars.map(([a,b])=>[a*u,b*u])}
const c128=(v,w,h)=>c128b(v,w).map(([a,b])=>`M${num(a)} 0h${num(b)}v${h}h${num(-b)}z`).join('');

/* ---------- layer markup ---------- */
function voidT(){const V=S.void,cx=S.w/2,cy=S.h/2;
 return `<g transform="rotate(${V.angle} ${cx} ${cy})">`+V.lines.map((l,i)=>`<text x="${cx+V.x+(l.dx||0)}" y="${cy+V.y+(i-1)*V.gap}" font-size="${num(l.size*PT)}" text-anchor="${V.align||'middle'}" dominant-baseline="central" letter-spacing="${V.ls}">${esc(Array(Math.max(1,l.rep|0)).fill(l.t).join(' '))}</text>`).join('')+'</g>'}
function itm(it){const t=`translate(${S.w/2+it.x} ${S.h/2+it.y}) rotate(${it.rot})`;
 if(it.type=='text')return `<text transform="${t}" font-size="${num(it.size*PT)}" text-anchor="${it.align||'middle'}" dominant-baseline="central">${esc(it.t)}</text>`;
 if(it.type=='rect'||it.type=='circle')return `<path transform="${t}" d="${sd(it)}" fill-rule="evenodd"/>`;
 return `<g transform="${t} scale(${it.w/it.vw}) translate(${-(it.vx+it.vw/2)} ${-(it.vy+it.vh/2)})">${it.inner}</g>`}
function sd(it){const w=+it.w||10,h=+(it.type=='circle'?(it.h||w):(it.h||6)),sw=+it.sw||0,r=+it.rad||0,
 sh=(w,h,r)=>it.type=='circle'?`M${-w/2} 0A${w/2} ${h/2} 0 1 0 ${w/2} 0A${w/2} ${h/2} 0 1 0 ${-w/2} 0Z`:rr(-w/2,-h/2,w,h,r);
 return sh(w,h,r)+(sw>0&&w>2*sw&&h>2*sw?sh(w-2*sw,h-2*sw,Math.max(0,r-sw)):'')}
function dat(it){if(['rect','circle','svg'].includes(it.type))return itm(it);const t=`translate(${S.w/2+it.x} ${S.h/2+it.y}) rotate(${it.rot})`;
 if(it.type=='num')return `<text transform="${t}" font-size="${num(it.size*PT)}" text-anchor="${it.align||'middle'}" dominant-baseline="central" ${fa(S.data.font)}>${esc(it.v)}</text>`;
 return `<g transform="${t}"><path transform="translate(${-it.w/2} ${-it.h/2})" d="${c128(it.v,it.w,it.h)}"/>`+(it.txt?`<text y="${it.h/2+2}" font-size="2.2" text-anchor="middle" dominant-baseline="central" ${fa(S.data.font)}>${esc(it.v)}</text>`:'')+'</g>'}

const SIDE=['Top','Right','Bottom','Left'];
function defaultSides(){return ['GENUINE LABELLOCK SECURITY SEAL · ','MADE IN BRITAIN · ','GENUINE LABELLOCK SECURITY SEAL · ','MADE IN BRITAIN · '].map(t=>({t,al:'fit'}))}
const KM={Micro_Security_Text:'micro',Void_Message:'void',Release_Layer:'rel',White_Layer:'white',Data:'data'};
function sideLines(){const m=S.micro,W=S.w,H=S.h,s=m.safe,b=m.band,c=s+b/2+(m.off||0),rc=S.shape=='round'?Math.max(0,S.r-s):0,sd=m.sides||defaultSides();
 const B=[[s+rc,c,W-s-rc,c,0,1],[W-c,s+b,W-c,H-s-b,-1,0],[s+rc,H-c,W-s-rc,H-c,0,-1],[c,H-s-b,c,s+b,1,0]];
 return B.map(([x0,y0,x1,y1,ix,iy],k)=>{const q=sd[k]||{},L=Math.hypot(x1-x0,y1-y0)||1,ux=(x1-x0)/L,uy=(y1-y0)/L,dy=+q.dy||0,ins=+q.ins||0,dx=(q.al||'fit')=='fit'?0:(+q.dx||0);
  return [x0+ix*dy+ux*(ins+dx),y0+iy*dy+uy*(ins+dx),x1+ix*dy-ux*(ins-dx),y1+iy*dy-uy*(ins-dx)]})}
function microSvg(mm){const m=S.micro,at=`${fa(m.font)} fill="${m.color}" dominant-baseline="central"`;
 if(m.mode!='sides')return `<path id="mp" d="${shapeD(m.safe+m.band/2+(m.off||0))}" fill="none"/><text id="mtx" ${at} font-size="${num(m.size*PT)}" letter-spacing="${mm?mm.ls:(m.ls||0)}"><textPath id="mt" href="#mp">${esc(mm?mm.txt:m.text)}</textPath></text>`;
 return sideLines().map((l,k)=>{const q=(m.sides||[])[k]||{},it=mm&&mm.items?mm.items[k]:null,an=it?it.an:((q.al=='right')?'end':q.al=='center'?'middle':'start');
  return `<path id="mp${k}" d="M${num(l[0])} ${num(l[1])}L${num(l[2])} ${num(l[3])}" fill="none"/><text id="mtx${k}" ${at} font-size="${num((+q.size||m.size)*PT)}" letter-spacing="${it?it.ls:(m.ls||0)}" text-anchor="${an}"><textPath id="mt${k}" href="#mp${k}" startOffset="${an=='middle'?'50%':an=='end'?'100%':'0'}">${esc(it?it.txt:q.t||'')}</textPath></text>`}).join('')}
function build(ex){const W=S.w,H=S.h,d0=shapeD(0),m=S.micro,V=S.void,eo=S.shape=='custom'?' fill-rule="evenodd" clip-rule="evenodd"':'';
 const L=(id,n,on,x)=>{const k=KM[id],vis=on&&(ex||!S.solo||S.solo==k);return `<g id="${id}" inkscape:label="${n}" inkscape:groupmode="layer"${vis?'':' display="none"'}${S[k].ovp?' style="mix-blend-mode:multiply"':''}>${x}</g>`};
 const di=shapeD(m.on?m.safe+m.band:0),ww=W-10,wh=H-10,mm=ex&&M.key==mkey()?M:null;
 let o=`<svg id="sv" xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" `+(ex?`width="${W}mm" height="${H}mm" viewBox="0 0 ${W} ${H}"`:`viewBox="-6 -6 ${W+12} ${H+12}"`)+`><defs><clipPath id="cl"><path d="${di}"${eo}/></clipPath></defs>`;
 if(!ex)o+=`<path d="${d0}"${eo} fill="${S.sub||'#b9bcc2'}"/>`;
 o+=L('Micro_Security_Text','Micro Security Text',m.on,microSvg(mm));
 o+=L('Void_Message','Void Message',V.on,`<g clip-path="url(#cl)" fill="${V.color}" ${fa(V.font)}>${voidT()}${(V.items||[]).map(itm).join('')}</g>`);
 o+=L('Release_Layer','Release Layer',S.rel.on,(`<mask id="mr" maskUnits="userSpaceOnUse" x="-5" y="-5" width="${W+10}" height="${H+10}"><rect x="-5" y="-5" width="${W+10}" height="${H+10}" fill="#fff"/><g fill="#000" ${fa(V.font)}>${voidT()}${[...(V.items||[]),...(S.rel.items||[])].map(itm).join('')}</g></mask><path d="${di}"${eo} fill="${S.rel.color}" mask="url(#mr)"/>`));
 o+=L('White_Layer','White Layer',S.white.on,(ww>0&&wh>0?`<mask id="mw" maskUnits="userSpaceOnUse" x="5" y="5" width="${ww}" height="${wh}"><rect x="5" y="5" width="${ww}" height="${wh}" fill="#fff"/><g fill="#000" ${fa(S.white.font)}>${S.white.items.map(itm).join('')}</g></mask><rect x="5" y="5" width="${ww}" height="${wh}" fill="#fff" fill-opacity="${S.white.op}" mask="url(#mw)"/>`:''));
 o+=L('Data','Data',S.data.on,`<g fill="${S.data.color}">${S.data.items.map(dat).join('')}</g>`);
 if(!ex&&S.guides)o+=`<g fill="none" stroke-width=".2" pointer-events="none"><path d="${d0}" stroke="#888"/><path d="${shapeD(m.safe)}" stroke="#e0457b" stroke-dasharray="1 1"/><path d="${shapeD(m.safe+m.band)}" stroke="#e0457b" stroke-dasharray="1 1"/>${ww>0&&wh>0?`<rect x="5" y="5" width="${ww}" height="${wh}" stroke="#2a9d8f" stroke-dasharray="1 1"/>`:''}</g>`;
 return o+'</svg>'}
const mkey=()=>[S.micro.text,S.micro.size,S.micro.safe,S.micro.band,S.micro.ls,S.micro.reps,S.micro.off,S.micro.mode,JSON.stringify(S.micro.sides),S.shape,S.w,S.h,S.r,S.custom&&S.custom.bw].join('|');

function render(){
 if(S.shape=='square'||S.shape=='circle'){S.h=S.w;const e=$('[data-p=h]');if(e)e.value=S.h}
 $('#stage').innerHTML=build(false);
 const m=S.micro;let w='';
 if(m.mode=='sides'){M={key:mkey(),items:[]};const ws=[];
  sideLines().forEach((l,k)=>{const sd=m.sides[k],t=$('#mt'+k),x=$('#mtx'+k),per=Math.hypot(l[2]-l[0],l[3]-l[1]);
   if(!t||!sd.t.trim()){M.items.push(null);return}
   const al=sd.al||'fit',an=al=='right'?'end':al=='center'?'middle':'start';
   x.setAttribute('letter-spacing',m.ls||0);t.textContent=sd.t;const len=x.getComputedTextLength(),ch=[...sd.t].length;let txt=sd.t,ls=m.ls||0;
   if(al=='fit'&&len>0){const mx=Math.floor(per/len),n=Math.max(1,m.reps>0?Math.min(m.reps,mx||1):mx);txt=sd.t.repeat(n);ls+=(per-n*len)/(n*ch);if(mx<1)ws.push(SIDE[k]+' text is longer than its edge')}
   else if(len>per+.01)ws.push(SIDE[k]+' text is longer than its edge');
   x.setAttribute('letter-spacing',ls);x.setAttribute('text-anchor',an);t.setAttribute('startOffset',an=='middle'?'50%':an=='end'?'100%':'0');t.textContent=txt;
   M.items.push({txt,ls,an,per,fit:al=='fit',size:+sd.size||m.size})});
  w=ws.join('. ')+(m.size*PT>m.band?' Text is taller than the band.':'')}
 else{const t=$('#mt'),x=$('#mtx'),p=$('#mp');
  if(t&&m.text.trim()&&p.getAttribute('d')){x.setAttribute('letter-spacing',m.ls||0);t.textContent=m.text;
   const len=x.getComputedTextLength(),per=p.getTotalLength(),ch=[...m.text].length;
   if(len>0&&per>0){const mx=Math.floor(per/len),n=Math.max(1,m.reps>0?Math.min(m.reps,mx||1):mx),ls=(m.ls||0)+(per-n*len)/(n*ch);
    x.setAttribute('letter-spacing',ls);t.textContent=m.text.repeat(n);M={key:mkey(),txt:m.text.repeat(n),ls,per,n};
    w=`${n} full repeat${n>1?'s':''}, spacing justified to ${num(ls)}mm.`+(mx<1?' Text is longer than the perimeter: shorten it or reduce size.':'')+(m.size*PT>m.band?' Text is taller than the band.':'')}}}
 const e=$('#mwarn');if(e)e.textContent=w;if(S.w<=10||S.h<=10)msg('The White Layer is the label minus 10mm in width and height, so it needs a label bigger than 10mm each way.')}

/* ---------- panel ---------- */
const inp=(p,l,t='number',a='',c='')=>`<label class="${c}">${l}<input data-p="${p}" type="${t}" value="${esc(get(S,p)??'')}" step="any" ${a}></label>`;
const det=(t,k,b)=>`<details open><summary><input type="checkbox" data-p="${k}.on" ${get(S,k+'.on')?'checked':''}>${t}</summary><div class="b">${b}</div></details>`;
const LK=[['micro','Micro Security Text'],['void','Void Message'],['rel','Release Layer'],['white','White Layer'],['data','Data']];
const layersUi=()=>`<details open><summary>Layers (top to bottom)</summary><div class="b">`+[...LK].reverse().map(([k,n])=>`<div class="row" style="grid-template-columns:auto 1fr auto auto;align-items:center"><input type="checkbox" data-p="${k}.on" ${S[k].on?'checked':''}><b>${n}</b><label style="flex-direction:row;align-items:center;gap:4px"><input type="checkbox" data-p="${k}.ovp" ${S[k].ovp?'checked':''}>Overprint</label><button data-a="solo" data-k="${k}"${S.solo==k?' class="p"':''}>Solo</button></div>`).join('')+`<small>Solo shows one layer on its own in the preview (exports are unaffected). Overprint multiplies the layer over those below in the preview and is flagged in the PDF.</small></div></details>`;
const itemsList=k=>(S[k].items||[]).map((it,i)=>{const P=n=>`${k}.items.${i}.${n}`;let f;
 if(it.type=='text')f=inp(P('t'),'Text','text','','w')+inp(P('size'),'Size pt')+asel(P('align'));
 else if(it.type=='num')f=inp(P('v'),'Number','text','','w')+inp(P('size'),'Size pt')+asel(P('align'));
 else if(it.type=='code128')f=inp(P('v'),'Barcode value (Code 128)','text','','w')+inp(P('w'),'Width mm')+inp(P('h'),'Bar height mm')+`<label><span>Value below</span><input type="checkbox" data-p="${P('txt')}" ${it.txt?'checked':''}></label>`;
 else if(it.type=='svg')f=`<span class="w">Logo: ${esc(it.name||'graphic')}</span>`+inp(P('w'),'Width mm');
 else f=inp(P('w'),it.type=='circle'?'Width / diameter mm':'Width mm')+inp(P('h'),'Height mm')+(it.type=='rect'?inp(P('rad'),'Corner radius'):'')+inp(P('sw'),'Outline mm (0 = solid)');
 return `<div class="row">${f}${inp(P('x'),'X')}${inp(P('y'),'Y')}${inp(P('rot'),'Rotate °')}<button data-a="del" data-l="${k}" data-i="${i}">Remove</button></div>`}).join('');
const addBtns=(k,x='')=>`<div class="w"><button data-a="addr" data-l="${k}">+ Rectangle</button> <button data-a="addc" data-l="${k}">+ Circle</button> <button data-a="addl" data-l="${k}">+ Logo (SVG / PDF / EPS)</button> ${x}</div>`;
const microUi=()=>`<label>Layout<select data-p="micro.mode"><option value="cont"${S.micro.mode!='sides'?' selected':''}>One continuous line</option><option value="sides"${S.micro.mode=='sides'?' selected':''}>Four sides</option></select></label>`+(S.micro.mode=='sides'?(S.micro.sides||defaultSides()).map((sd,k)=>`<div class="row">${inp(`micro.sides.${k}.t`,SIDE[k]+' text','text','','w')}<label>Alignment<select data-p="micro.sides.${k}.al">${[['fit','Repeat to fit'],['left','Left'],['center','Centre'],['right','Right']].map(([v,n])=>`<option value="${v}"${(sd.al||'fit')==v?' selected':''}>${n}</option>`).join('')}</select></label>${inp(`micro.sides.${k}.size`,'Size pt (0 = global)')}${inp(`micro.sides.${k}.dy`,'Inset mm (inward)')}${inp(`micro.sides.${k}.dx`,'Shift along mm')}${inp(`micro.sides.${k}.ins`,'End margin mm')}</div>`).join(''):inp('micro.text','Text','text','','w'));
